name: Windows build

# Lets Windows builds happen without owning a Windows machine — this runs
# on GitHub's own windows-latest runner. Manual trigger (Actions tab → Run
# workflow) or automatic on every push to `windows`.
on:
  workflow_dispatch:
  push:
    branches: [windows]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: tide-windows
          path: build/windows/x64/runner/Release/
