name: tide
description: "Tide — 화면을 캡처하면 에이전트가 할 일을 만들어 주는 데스크톱 앱."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.8.3+12

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  hotkey_manager: ^0.2.3
  screen_capturer: ^0.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  # Windows has no /etc/localtime to read an IANA zone name out of; this
  # supplies one. See `StorageService.localIanaTimeZone`.
  flutter_timezone: ^5.1.0
  webview_flutter: ^4.14.1
  # The Windows implementation *of* webview_flutter (it registers itself as the
  # platform there), so one `WebViewController` drives both desktops.
  #
  # 🔑 Not `webview_windows`, which draws WebView2 into a Flutter texture: on
  # Windows 11 + a current WebView2 runtime that texture stays blank, so the
  # dashboard was a white rectangle. This one parents a real WebView2 window
  # over the Flutter window instead, which renders. The price is that Flutter
  # widgets can't be drawn on top of it — see `DashboardView`.
  webview_win_floating: ^3.0.3
  http: ^1.6.0
  http_parser: ^4.1.2
  app_links: ^7.2.1
  # Windows registers custom URL schemes in the registry rather than in an
  # app manifest. See `UrlSchemeService`.
  win32_registry: ^2.1.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.3.0
  flutter_local_notifications: ^22.3.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Tide wordmark, copied from `tide-kit-v3.0/assets/brand/` in the dochi
  # repo — the same asset `TideLogo` renders on the web dashboard.
  assets:
    # 로고 마크 + "Tide" 글자가 한 줄로 들어 있다. 로그인 화면은 이것만 쓴다
    # — 워드마크와 "Tide" 제목을 따로 두면 같은 단어가 두 번 나온다.
    - assets/brand/tide-logo-horizontal.svg
    - assets/brand/tide-wordmark.svg
    - assets/tray/tide-menubar-template.png
    # Windows tray. The macOS template PNG above is monochrome and relies on
    # macOS auto-inverting it; Windows does no such thing, so it needs its own.
    - assets/tray/tide-tray.ico
    # Windows 토스트 알림이 쓰는 두 장. 에셋 번들 안에서는 셸이 못 읽어서
    # 실행할 때 파일로 꺼내 쓴다 — `NotificationService` 참고.
    #   머리줄(앱 이름 왼쪽)의 작은 심벌. 테마와 무관하게 이 한 장이다 —
    #   인디고 원이라 밝은 토스트에서도 어두운 토스트에서도 읽힌다.
    #   원본 SVG가 옆에 같이 있다.
    - assets/brand/tide-symbol-256.png
    #   본문 왼쪽의 큰 로고(appLogoOverride).
    - assets/app-icon/png/tide-app-icon-256.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Microsoft Store 배포용 MSIX 패키징 (`dart run msix:create`).
#
# 🔑 MSIX 설치 폴더는 읽기 전용이다 — WebView2 프로필을 실행 파일 옆에 두면
# 대시보드가 빈 화면이 된다. `AppPaths.webViewDataFolder`가 그것을
# LOCALAPPDATA로 빼 두었으므로 여기서는 따로 할 일이 없다.
#
# 🔑 `protocol_activation`이 `dochi://` 딥링크 로그인을 살린다. 패키지 앱에서는
# `UrlSchemeService`의 런타임 레지스트리 쓰기가 가상화돼 시스템에 등록되지
# 않으므로, 매니페스트에 선언하는 이 줄이 유일한 경로다.
msix_config:
  # 🔴 Partner Center에 **예약한 이름과 글자까지 같아야** 한다. 다르면 업로드
  # 단계에서 거절된다. 앱 이름은 `Tide`가 아니라 `Tide AI`다 — 예약 이름에서
  # 파생된 `identity_name: Tide.TideAI`가 그것을 말해 준다.
  display_name: Tide AI
  # 🔴 아래 세 줄은 Partner Center가 이름 예약 때 발급한 실제 값이다
  # (Product management → Product identity). Store가 업로드된 패키지를
  # 받아 주는 조건이 이 값들과의 글자 단위 일치이고, **한 번 게시한 뒤에는
  # 바꿀 수 없다** — 바꾸면 다른 앱이 되고 기존 사용자가 업데이트를 받지
  # 못한다(Inno의 `AppId`와 같은 원리). 손대지 않는다.
  publisher_display_name: Tide
  identity_name: Tide.TideAI
  publisher: CN=13D7E6E9-D1D3-496D-824D-D95DACA8E9E9
  # 🔑 `msix_version`은 일부러 없다. 없으면 도구가 위의 `version:`에서
  # `major.minor.patch.0`을 만든다 — Store가 요구하는 네 자리와, 마지막
  # 자리가 반드시 0이어야 한다는 규칙까지 그대로 맞는다. 여기 적어 두면
  # `version:`을 올릴 때 같이 올리는 걸 잊는 순간 조용히 어긋난다.
  # 🔑 Store 제출본을 만든다 — 서명하지 않고, 위의 `publisher`를 그대로
  # 매니페스트에 쓴다. 이 줄이 없으면 패키지가 동봉된 테스트 인증서로
  # 서명되면서 Publisher가 그 인증서의 주체(`CN=Msix Testing, …`)로
  # **덮어써진다**. 패키지의 Publisher는 서명 인증서와 반드시 일치해야 하기
  # 때문이고, 그 상태로 올리면 Partner Center가 신원 불일치로 거절한다.
  # 서명은 Microsoft가 한다 — 그래서 Store 경로에서는 SmartScreen 경고가
  # 사라진다.
  store: true
  logo_path: assets/app-icon/png/tide-app-icon-256.png
  capabilities: internetClient
  protocol_activation: dochi
  # 빌드가 대화형 프롬프트에서 멈추지 않게 한다. 로컬 검증은 개발자 모드의
  # loose-file 등록(`Add-AppxPackage -Register`)으로 하므로 테스트 인증서를
  # 신뢰 저장소에 넣을 일이 없고, Store 제출본은 Microsoft가 서명한다.
  install_certificate: false
  # 🔴 빌드 폴더 밖으로 뺀다. `[Files]`가 빌드 폴더를 통째로 담기 때문에,
  # 여기 떨어뜨리면 14MB짜리 msix가 Inno 설치 프로그램 안에 같이 실린다
  # (실제로 한 번 23.6MB가 나왔다).
  output_path: .dist-scratch/msix
  # 🔑 산출물 이름을 고정한다. 안 쓰면 파일 이름이 `display_name`을 따라가서,
  # Store 이름이 바뀔 때마다 릴리스 절차의 파일 경로가 같이 바뀐다.
  output_name: Tide
